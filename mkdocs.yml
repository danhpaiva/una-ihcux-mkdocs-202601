site_name: "Interacao Humano Computador e UX - UNA"
site_url: https://danhpaiva.github.io/una-ihcux-mkdocs-202601
site_author: Daniel Paiva

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.sections
    - navigation.expand # Deixa o menu lateral aberto por padrão
    - navigation.top # Botão "Voltar ao topo" automático
    - navigation.tracking # Atualiza a URL conforme o aluno rola a página
    - content.code.copy # Botão de copiar código em um clique

nav:
  - Home: index.md
  # - Guia do Professor: setup.md
  - 📖 Aulas:
      - 01. Interfaces: aulas/01-aula.md
      - 02. Interfaces: aulas/02-aula.md
      - 03. UX: aulas/03-aula.md
      # - 04. UX: aulas/04-aula.md
  - 📝 Listas:
      - Lista 01: listas/01-lista.md
  # - 📝 Atividades:
  #    - Projeto 01: trabalhos/projeto-01.md

plugins:
  - search
  - git-revision-date-localized

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
